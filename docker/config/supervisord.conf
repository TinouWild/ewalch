[supervisord]
nodaemon=true
user=root
; Hors du dossier de l'application (monté en dev) pour ne plus polluer le dépôt
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true

[program:cron]
command=cron -f
autostart=true
autorestart=true
user=root
